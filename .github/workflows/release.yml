name: Release CLI
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install
      - run: pnpm check
      - run: pnpm release:pack
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Publish checked release assets
        run: gh release create "$RELEASE_TAG" release/concentrate-cli.tar.gz release/SHA256SUMS release/install.sh --verify-tag --title "$RELEASE_TAG" --notes-file release/NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
