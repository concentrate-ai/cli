name: PR base
# main stays the default branch, but work merges into dev first; only dev is promoted to main.
on:
  # _target so fork PRs get a token that can edit; safe because nothing is checked out.
  pull_request_target:
    types: [opened]
    branches: [main]
permissions:
  pull-requests: write
jobs:
  retarget:
    if: github.head_ref != 'dev'
    runs-on: ubuntu-latest
    steps:
      - run: gh pr edit "$PR" --repo "$REPO" --base dev
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
